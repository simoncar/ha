blinds_down:
  alias: Blinds Down
  sequence:
  - service: remote.send_command
    target:
      entity_id: remote.universal_remote_living_room_remote
    data:
      device: blinds
      command:
      - down
      num_repeats: 1
      delay_secs: 0.4
      hold_secs: 0
  - delay:
      hours: 0
      minutes: 0
      seconds: 4
      milliseconds: 0
  - service: remote.send_command
    target:
      entity_id: remote.universal_remote_living_room_remote
    data:
      device: blinds
      command:
      - down1
      - down2
      num_repeats: 1
      delay_secs: 0.4
      hold_secs: 0
  - delay:
      hours: 0
      minutes: 0
      seconds: 4
      milliseconds: 0
  - service: remote.send_command
    target:
      entity_id: remote.universal_remote_living_room_remote
    data:
      device: blinds
      command:
      - down1
      - down2
      - down3
      num_repeats: 1
      delay_secs: 0.4
      hold_secs: 0
  - delay:
      hours: 0
      minutes: 0
      seconds: 4
      milliseconds: 0
  - service: remote.send_command
    target:
      entity_id: remote.universal_remote_living_room_remote
    data:
      device: blinds
      command:
      - down1
      - down2
      - down3
      - down4
      num_repeats: 1
      delay_secs: 0.4
      hold_secs: 0
  mode: single
  icon: hass:blinds
